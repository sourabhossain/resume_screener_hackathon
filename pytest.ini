[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_test.py
# --ds forces test settings even when DJANGO_SETTINGS_MODULE=config.settings.dev
# is set in the container env (otherwise pytest would try to use MySQL dev DB).
addopts = -v --tb=short --ds=config.settings.test
testpaths = apps
