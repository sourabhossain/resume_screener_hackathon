<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted - Career</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .gradient-bg { background: linear-gradient(145deg, #4f46e5 0%, #6366f1 55%, #7c3aed 100%); }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
        }
        .dark .glass { background: rgba(9,9,11,0.78); }
        .btn-primary {
            background-color: #4f46e5;
            box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px -4px rgba(79,70,229,.45);
            transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 8px 24px -6px rgba(79,70,229,.5);
        }
        .animate-fade-in {
            animation: fadeIn 0.55s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-ring {
            0%   { transform: scale(1);    opacity: .6; }
            70%  { transform: scale(1.12); opacity: 0; }
            100% { transform: scale(1);    opacity: 0; }
        }
        .pulse-ring {
            animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="flex min-h-screen flex-col bg-zinc-50 text-zinc-900 antialiased transition-colors duration-200 dark:bg-zinc-950 dark:text-zinc-100">

    <!-- Background decoration -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-40 left-1/2 h-[min(42rem,90vh)] w-[min(140%,52rem)] -translate-x-1/2 rounded-[100%] bg-gradient-to-b from-primary-500/[0.12] to-transparent blur-3xl dark:from-primary-500/[0.16]"></div>
        <div class="absolute right-[-10%] top-[12%] h-72 w-72 rounded-full bg-violet-600/[0.06] blur-3xl dark:bg-violet-500/[0.12]"></div>
        <div class="absolute bottom-0 left-[-15%] h-56 w-56 rounded-full bg-amber-500/[0.05] blur-3xl dark:bg-amber-500/[0.08]"></div>
    </div>

    <!-- Minimal nav -->
    <nav class="glass sticky top-0 z-50 border-b border-zinc-200/80 dark:border-zinc-800/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
            <a href="/" class="group flex items-center space-x-3">
                <div class="gradient-bg flex h-10 w-10 items-center justify-center rounded-lg shadow-md shadow-indigo-500/25 transition-transform duration-200 group-hover:scale-[1.02]">
                    <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <span class="hidden text-xl font-semibold tracking-tight sm:block">
                    <span class="gradient-text">Career</span>
                </span>
            </a>
            <button @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)"
                    aria-label="Toggle dark mode"
                    class="rounded-xl border border-zinc-200 bg-white p-2.5 shadow-sm transition-colors hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:hover:bg-zinc-800">
                <svg x-show="!darkMode" class="h-5 w-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg x-show="darkMode" class="h-5 w-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Error content -->
    <main class="flex flex-1 items-center justify-center px-4 py-16">
        <div class="animate-fade-in w-full max-w-lg text-center">

            <!-- Large number + pulsing icon -->
            <div class="relative mb-8 inline-block select-none">
                <span class="text-[clamp(7rem,25vw,11rem)] font-black leading-none text-zinc-100 dark:text-zinc-800">403</span>
                <div class="absolute inset-0 flex items-center justify-center">
                    <!-- Pulsing background ring -->
                    <div class="absolute h-24 w-24 rounded-full bg-amber-400/20 pulse-ring sm:h-28 sm:w-28"></div>
                    <!-- Icon container -->
                    <div class="flex h-24 w-24 items-center justify-center rounded-full bg-amber-50 ring-1 ring-amber-200/70 dark:bg-amber-950/40 dark:ring-amber-800/40 sm:h-28 sm:w-28">
                        <svg class="h-11 w-11 text-amber-500 dark:text-amber-400 sm:h-13 sm:w-13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Title -->
            <h1 class="mb-3 text-2xl font-semibold tracking-tight text-zinc-900 dark:text-white sm:text-3xl">
                Access Restricted
            </h1>

            <!-- Description -->
            <p class="mx-auto mb-3 max-w-sm text-base leading-relaxed text-zinc-500 dark:text-zinc-400">
                You've made too many requests in a short period of time.
            </p>
            <p class="mx-auto mb-10 max-w-sm text-sm text-zinc-500 dark:text-zinc-400">
                Please wait a few minutes and try again.
            </p>

            <!-- Countdown hint -->
            <div class="mx-auto mb-10 flex w-fit items-center gap-2 rounded-full border border-amber-200/70 bg-amber-50 px-4 py-2 text-sm font-medium text-amber-700 dark:border-amber-800/40 dark:bg-amber-950/30 dark:text-amber-400">
                <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Rate limit resets every hour
            </div>

            <!-- Action buttons -->
            <div class="flex flex-col items-center justify-center gap-3 sm:flex-row sm:gap-4">
                <a href="#" onclick="history.back(); return false;"
                   class="btn-primary inline-flex w-full items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold text-white sm:w-auto">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Go Back
                </a>
                <a href="/careers/"
                   class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-zinc-200 px-6 py-3 text-sm font-medium text-zinc-700 transition-colors hover:bg-zinc-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800 sm:w-auto">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    View all jobs
                </a>
            </div>

        </div>
    </main>

</body>
</html>
