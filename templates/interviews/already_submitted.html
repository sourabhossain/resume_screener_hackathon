{% extends 'base.html' %}
{% block title %}Already Submitted{% endblock %}
{% block nav_action %}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
    <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-amber-100 dark:bg-amber-900/30">
        <svg class="h-10 w-10 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>
    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">Already Submitted</h1>
    <p class="mt-3 text-zinc-500 dark:text-zinc-400">
        This evaluation was already submitted on
        <span class="font-semibold text-zinc-700 dark:text-zinc-300">{{ ev.submitted_at|date:"F j, Y" }}</span>.
        Each link can only be used once.
    </p>
</div>
{% endblock %}
