<div x-data="{
  dragCounter: 0,
  fileName: '',
  fileType: '',
  error: '',
  invalid: {{ invalid|yesno:'true,false' }},
  handleFile(file) {
    const type = file.name.split('.').pop().toLowerCase();
    if (!['pdf', 'docx'].includes(type)) { this.reject('Only PDF or DOCX files can be uploaded.'); return; }
    this.error = '';
    this.invalid = false;
    this.fileName = file.name;
    this.fileType = type;
    if (this.$refs.fileInput.files[0] !== file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      this.$refs.fileInput.files = dt.files;
    }
  },
  reject(message) {
    this.error = message;
    this.invalid = true;
    this.$refs.fileInput.value = '';
    this.fileName = '';
  },
  clearFile() {
    this.dragCounter = 0;
    this.fileName = '';
    this.fileType = '';
    this.$refs.fileInput.value = '';
    this.$nextTick(() => this.$refs.fileInput.focus());
  }
}">
    <input type="file" name="file" id="id_file" x-ref="fileInput" accept=".pdf,.docx" class="peer sr-only"
           required aria-required="true" aria-labelledby="id_file_label" aria-describedby="id_file_hint id_file_error"
           :aria-invalid="invalid ? 'true' : null"
           @invalid="invalid = true"
           @change="if ($event.target.files[0]) handleFile($event.target.files[0])">

    <label for="id_file" x-show="!fileName"
           class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed bg-zinc-50 px-6 py-10 text-center transition-colors hover:border-zinc-400 peer-focus-visible:ring-2 peer-focus-visible:ring-[#284699] peer-focus-visible:ring-offset-2 dark:bg-zinc-900 dark:hover:border-zinc-500 dark:peer-focus-visible:ring-offset-zinc-950"
           :class="invalid ? 'border-rose-400 dark:border-rose-500' : (dragCounter > 0 ? 'border-[#284699] bg-[#284699]/5 dark:bg-[#284699]/15' : 'border-zinc-300 dark:border-zinc-700')"
           @dragenter.prevent="dragCounter++"
           @dragleave.prevent="dragCounter--"
           @dragover.prevent
           @drop.prevent="dragCounter = 0; if ($event.dataTransfer.files[0]) handleFile($event.dataTransfer.files[0])">
        <svg class="mx-auto mb-3 h-10 w-10 text-zinc-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
        <span class="mb-1 text-sm font-medium text-zinc-700 dark:text-zinc-300">Drag &amp; drop your resume here</span>
        <span class="mb-3 text-xs text-zinc-500 dark:text-zinc-400">or</span>
        <span class="inline-block rounded-full bg-zinc-900 px-4 py-2 text-xs font-semibold text-white transition hover:bg-zinc-700 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-200">Browse file</span>
        <span id="id_file_hint" class="mt-3 text-xs text-zinc-500 dark:text-zinc-400">Supported: PDF, DOCX only · Max 5MB</span>
    </label>
    <p id="id_file_error" x-show="error" x-text="error" x-cloak role="alert" class="mt-2 text-sm font-medium text-rose-600 dark:text-rose-400"></p>

    <div x-show="fileName"
         style="display:none"
         class="flex items-center gap-3 rounded-xl border border-zinc-200 bg-white p-4 dark:border-zinc-700 dark:bg-zinc-900">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
             :class="fileType === 'pdf' ? 'bg-red-100 dark:bg-red-900/30' : 'bg-blue-100 dark:bg-blue-900/30'">
            <svg class="h-5 w-5" aria-hidden="true"
                 :class="fileType === 'pdf' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'"
                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
        </div>
        <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-zinc-900 dark:text-white" x-text="fileName"></p>
            <p class="text-xs text-zinc-500 dark:text-zinc-400" x-text="fileType.toUpperCase() + ' file'"></p>
        </div>
        <svg class="h-5 w-5 shrink-0 text-emerald-600 dark:text-emerald-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <div class="flex shrink-0 items-center gap-1">
            <button type="button" @click="$refs.fileInput.click()"
                    class="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">
                Change
            </button>
            <button type="button" @click="clearFile()"
                    class="rounded-lg p-1.5 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-700 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-200"
                    aria-label="Remove file">
                <svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>
</div>
