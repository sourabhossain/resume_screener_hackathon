{% comment %}
Reusable drag-&-drop resume upload, matching the recruiter "Add Resume" form.
Expects the bound form field `form.file` (name="file", id="id_file") in context.
{% endcomment %}
<div x-data="{
  dragCounter: 0,
  fileName: '',
  fileSize: '',
  fileType: '',
  handleFile(file) {
    this.fileName = file.name;
    this.fileSize = file.size > 1048576 ? (file.size / 1048576).toFixed(1) + ' MB' : Math.round(file.size / 1024) + ' KB';
    this.fileType = file.name.split('.').pop().toLowerCase();
    const dt = new DataTransfer();
    dt.items.add(file);
    this.$refs.fileInput.files = dt.files;
  },
  clearFile() {
    this.dragCounter = 0;
    this.fileName = '';
    this.fileSize = '';
    this.fileType = '';
    this.$refs.fileInput.value = '';
  }
}">
    <input type="file" name="file" id="id_file" x-ref="fileInput" accept=".pdf,.docx" class="sr-only"
           @change="if ($event.target.files[0]) handleFile($event.target.files[0])">

    <div x-show="!fileName"
         class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-zinc-300 bg-zinc-50 px-6 py-10 text-center transition-colors hover:border-indigo-400 dark:border-zinc-700 dark:bg-zinc-900 dark:hover:border-indigo-500"
         :class="dragCounter > 0 ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/30' : ''"
         @dragenter.prevent="dragCounter++"
         @dragleave.prevent="dragCounter--"
         @dragover.prevent
         @drop.prevent="dragCounter = 0; if ($event.dataTransfer.files[0]) handleFile($event.dataTransfer.files[0])"
         @click="$refs.fileInput.click()">
        <svg class="mx-auto mb-3 h-10 w-10 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
        <p class="mb-1 text-sm font-medium text-zinc-700 dark:text-zinc-300">Drag &amp; drop your resume here</p>
        <p class="mb-3 text-xs text-zinc-400">or</p>
        <span class="inline-block rounded-full bg-indigo-600 px-4 py-1.5 text-xs font-semibold text-white transition hover:bg-indigo-700">Browse file</span>
        <p class="mt-3 text-xs text-zinc-500 dark:text-zinc-400">Supported: PDF, DOCX only · Max 5MB</p>
    </div>

    <div x-show="fileName"
         style="display:none"
         class="flex items-center gap-3 rounded-xl border border-zinc-200 bg-white p-4 dark:border-zinc-700 dark:bg-zinc-900">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
             :class="fileType === 'pdf' ? 'bg-red-100 dark:bg-red-900/30' : 'bg-blue-100 dark:bg-blue-900/30'">
            <svg class="h-5 w-5"
                 :class="fileType === 'pdf' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'"
                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
        </div>
        <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-zinc-900 dark:text-white"
               x-text="fileName.length > 40 ? fileName.slice(0, 37) + '…' : fileName"></p>
            <p class="text-xs text-zinc-500 dark:text-zinc-400" x-text="fileSize"></p>
        </div>
        <svg class="h-5 w-5 shrink-0 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <div class="flex shrink-0 items-center gap-1">
            <button type="button" @click="$refs.fileInput.click()"
                    class="rounded px-2 py-1 text-xs font-semibold text-indigo-600 hover:underline hover:text-indigo-700 dark:text-indigo-400">
                Change
            </button>
            <button type="button" @click="clearFile()"
                    class="rounded p-1 text-zinc-400 transition hover:bg-zinc-100 hover:text-zinc-600 dark:hover:bg-zinc-800 dark:hover:text-zinc-300"
                    aria-label="Remove file">
                <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

</div>
