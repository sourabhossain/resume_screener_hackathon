<div data-title="{{ title }}">
    <form method="post" hx-post hx-target="#drawer-content" hx-swap="innerHTML" x-data="{ submitting: false }" @submit="submitting = true">
        {% csrf_token %}

        <div class="space-y-6">
            <div>
                <label for="id_title" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-2">
                    Job Title <span class="text-red-500">*</span>
                </label>
                {{ form.title }}
                {% if form.title.errors %}
                <p class="mt-2 text-sm text-red-600 dark:text-red-400">{{ form.title.errors.0 }}</p>
                {% endif %}
            </div>

            <div>
                <label for="id_description" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-2">
                    Job Description
                </label>
                {{ form.description }}
                <p class="mt-2 text-xs text-zinc-400 dark:text-zinc-500">Include requirements, responsibilities, and qualifications</p>
            </div>

            <div>
                <label for="id_status" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-2">
                    Status
                </label>
                {{ form.status }}
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="id_posted_date" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-2">
                        Posted Date
                    </label>
                    {{ form.posted_date }}
                </div>
                <div>
                    <label for="id_closing_date" class="block text-sm font-semibold text-zinc-700 dark:text-zinc-200 mb-2">
                        Closing Date
                    </label>
                    {{ form.closing_date }}
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800">
            <button type="button" @click="closeDrawer()"
                    class="px-5 py-2.5 border-2 border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-200 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 font-semibold">
                Cancel
            </button>
            <button type="submit"
                    :disabled="submitting"
                    :class="{ 'opacity-50 cursor-not-allowed': submitting }"
                    class="btn-primary text-white px-6 py-2.5 rounded-xl font-semibold shadow-lg flex items-center gap-2 transition-all">
                <svg x-show="submitting" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <template x-if="!submitting">
                    <span class="flex items-center gap-2">
                        {% if job %}
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Update Job
                        {% else %}
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        Create Job
                        {% endif %}
                    </span>
                </template>
                <span x-show="submitting">Saving...</span>
            </button>
        </div>
    </form>
</div>
