{% comment %}
Custom status picker UI — parent <form> must provide Alpine x-data (open, value, options, tone, hint, etc.).
{% endcomment %}
<div class="status-picker relative w-full sm:w-auto sm:min-w-[15.5rem]"
     :class="{ 'status-picker--open': open }">
    <input type="hidden" name="{{ name }}" :value="value">

    <button type="button"
            @click="open = !open"
            :aria-expanded="open"
            aria-haspopup="listbox"
            aria-label="Recruiter status"
            class="status-picker__trigger"
            :class="'status-picker__trigger--' + tone(value)">
        <span class="status-picker__badge status-picker__badge--sm" :class="'status-picker__badge--' + tone(value)" aria-hidden="true">
            <span class="status-picker__dot" :class="'status-picker__dot--' + tone(value)"></span>
        </span>
        <span class="min-w-0 flex-1 text-left">
            <span class="block truncate" x-text="labelFor(value)"></span>
        </span>
        <svg class="status-picker__chevron" :class="{ 'status-picker__chevron--open': open }" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>

    <div x-show="open"
        x-cloak
        @click.outside="open = false"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-[0.98] translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="status-picker__menu"
        role="listbox">
        <div class="status-picker__menu-header">
            <p class="status-picker__menu-title">Update status</p>
            <p class="status-picker__menu-subtitle">Track where this candidate is in your pipeline</p>
        </div>

        <div class="status-picker__group">
            <p class="status-picker__group-label">Pipeline</p>
            <template x-for="opt in options.filter(o => !isOutcome(o.value))" :key="opt.value">
                <button type="button"
                        role="option"
                        :aria-selected="opt.value === value"
                        @click="pick(opt.value)"
                        class="status-picker__option"
                        :class="{
                          'status-picker__option--active': opt.value === value,
                          ['status-picker__option--' + tone(opt.value)]: opt.value === value
                        }">
                    <span class="status-picker__badge" :class="'status-picker__badge--' + tone(opt.value)" aria-hidden="true">
                        <span class="status-picker__dot" :class="'status-picker__dot--' + tone(opt.value)"></span>
                    </span>
                    <span class="status-picker__option-body">
                        <span class="status-picker__option-label" x-text="opt.label"></span>
                        <span class="status-picker__option-hint" x-text="hint(opt.value)"></span>
                    </span>
                    <span class="status-picker__check" :class="{ 'status-picker__check--visible': opt.value === value }" aria-hidden="true">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                </button>
            </template>
        </div>

        <div class="status-picker__divider" aria-hidden="true"></div>

        <div class="status-picker__group">
            <p class="status-picker__group-label">Outcome</p>
            <template x-for="opt in options.filter(o => isOutcome(o.value))" :key="opt.value">
                <button type="button"
                        role="option"
                        :aria-selected="opt.value === value"
                        @click="pick(opt.value)"
                        class="status-picker__option"
                        :class="{
                          'status-picker__option--active': opt.value === value,
                          ['status-picker__option--' + tone(opt.value)]: opt.value === value
                        }">
                    <span class="status-picker__badge" :class="'status-picker__badge--' + tone(opt.value)" aria-hidden="true">
                        <span class="status-picker__dot" :class="'status-picker__dot--' + tone(opt.value)"></span>
                    </span>
                    <span class="status-picker__option-body">
                        <span class="status-picker__option-label" x-text="opt.label"></span>
                        <span class="status-picker__option-hint" x-text="hint(opt.value)"></span>
                    </span>
                    <span class="status-picker__check" :class="{ 'status-picker__check--visible': opt.value === value }" aria-hidden="true">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                </button>
            </template>
        </div>
    </div>
</div>
