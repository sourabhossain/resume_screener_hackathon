<div id="screening-action" class="w-full sm:w-auto"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% if resume.screening_status == 'processing' or resume.screening_status == 'pending' %}
    <button type="button" disabled
            class="btn-primary flex w-full cursor-not-allowed items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-semibold text-white opacity-60 sm:inline-flex sm:w-auto">
        <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Screening in progress…
    </button>
    {% elif resume.screening_status != 'completed' or not resume.final_score %}
    <form action="{% url 'core:resume_rescreen' resume.uuid %}" method="post" class="w-full sm:w-auto"
          hx-post="{% url 'core:resume_rescreen' resume.uuid %}"
          hx-target="#screening-status" hx-select="#screening-status" hx-swap="outerHTML" hx-push-url="false"
          x-data="{ submitting: false }" @submit="submitting = true">
        {% csrf_token %}
        <button type="submit"
                :disabled="submitting"
                :class="{ 'opacity-60 cursor-not-allowed': submitting }"
                class="btn-primary flex w-full items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-semibold text-white disabled:opacity-60 sm:inline-flex sm:w-auto">
            <svg x-show="submitting" style="display:none" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <svg x-show="!submitting" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
            </svg>
            <span x-show="!submitting">Run AI Screening</span>
            <span x-show="submitting" style="display:none">Screening...</span>
        </button>
    </form>
    {% endif %}
</div>
