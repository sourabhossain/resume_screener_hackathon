<button type="submit" name="recruiter_status" value="{{ opt.value }}" role="option" data-value="{{ opt.value }}" data-tone="{{ opt.tone }}" aria-selected="{% if opt.current %}true{% else %}false{% endif %}"{% if opt.blocked %} disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed"{% endif %} title="{% if opt.blocked %}Complete the Pre-Onboarding checklist first{% else %}{{ opt.hint }}{% endif %}" x-on:click="open = false" class="status-picker__option{% if opt.current %} status-picker__option--active status-picker__option--{{ opt.tone }}{% endif %}"><span class="status-picker__badge status-picker__badge--sm status-picker__badge--{{ opt.tone }}" aria-hidden="true"><span class="status-picker__dot status-picker__dot--{{ opt.tone }}"></span></span><span class="status-picker__option-body"><span class="status-picker__option-label truncate">{{ opt.label }}</span></span><span class="status-picker__check{% if opt.current %} status-picker__check--visible{% endif %}" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg></span></button>
