<form method="post"
      action="{% url 'core:resume_seen_update' resume.uuid %}"
      hx-post="{% url 'core:resume_seen_update' resume.uuid %}"
      hx-target="closest td"
      hx-swap="outerHTML"
      hx-select="unset"
      hx-disinherit="hx-target hx-select hx-swap hx-push-url"
      x-data="{ open: false, mx: 0, my: 0, up: false, toggle(btn) { if (this.open) { this.open = false; return; } const r = btn.getBoundingClientRect(); const below = window.innerHeight - r.bottom - 12; const above = r.top - 12; this.up = below < 160 && above > below; this.mx = Math.max(8, Math.min(r.left, window.innerWidth - 232)); this.my = this.up ? r.top - 6 : r.bottom + 6; this.open = true; } }"
      x-on:keydown.escape.window="open = false"
      x-on:scroll.window="open = false"
      class="relative inline-block">
    {% csrf_token %}
    <button type="button"
            x-on:click="toggle($event.currentTarget)"
            :aria-expanded="open"
            aria-haspopup="listbox"
            aria-label="Reviewed status for {{ resume.candidate_name|title }}"
            title="Mark whether this CV has been reviewed"
            class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold text-zinc-700 transition hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">
        <span class="status-picker__badge status-picker__badge--sm status-picker__badge--{{ resume.seen_status_tone }}" aria-hidden="true">
            <span class="status-picker__dot status-picker__dot--{{ resume.seen_status_tone }}"></span>
        </span>
        <span class="whitespace-nowrap">{{ resume.get_seen_status_display|default:"Not Seen" }}</span>
        <svg class="h-3 w-3 text-zinc-400 transition-transform" :class="{ 'rotate-180': open }" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div x-show="open" x-cloak
         x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
         x-on:click.outside="open = false"
         :style="`top:${my}px; left:${mx}px;${up ? ' transform: translateY(-100%);' : ''}`"
         class="fixed z-50 w-56 rounded-2xl border border-zinc-200 bg-white p-1.5 shadow-lg ring-1 ring-black/5 dark:border-zinc-700 dark:bg-zinc-900 dark:ring-white/10"
         role="listbox" style="display: none;">
        {% for opt in resume.seen_status_options %}
        <button type="submit" name="seen_status" value="{{ opt.value }}" role="option"
                aria-selected="{% if opt.current %}true{% else %}false{% endif %}"
                x-on:click="open = false"
                class="status-picker__option{% if opt.current %} status-picker__option--active status-picker__option--{{ opt.tone }}{% endif %}">
            <span class="status-picker__badge status-picker__badge--sm status-picker__badge--{{ opt.tone }}" aria-hidden="true">
                <span class="status-picker__dot status-picker__dot--{{ opt.tone }}"></span>
            </span>
            <span class="status-picker__option-body">
                <span class="status-picker__option-label">{{ opt.label }}</span>
            </span>
            <span class="status-picker__check{% if opt.current %} status-picker__check--visible{% endif %}" aria-hidden="true">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </span>
        </button>
        {% endfor %}
    </div>
</form>
