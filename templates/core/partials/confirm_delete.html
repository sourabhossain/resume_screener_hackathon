<div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-red-50 dark:bg-red-950/40">
    <svg class="h-8 w-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
    </svg>
</div>

<h2 class="mb-3 text-xl font-semibold tracking-tight text-zinc-900 dark:text-white">Delete {{ type|title }}?</h2>
<p class="mb-6 text-zinc-600 dark:text-zinc-400">
    Are you sure you want to delete 
    <span class="font-medium text-zinc-900 dark:text-white">
        {% if type == 'job' %}{{ object.title }}{% else %}{{ object.candidate_name }}{% endif %}
    </span>?
    <br><span class="text-sm">This action can be reversed later.</span>
</p>

<form method="post" hx-post hx-swap="none">
    {% csrf_token %}
    <div class="flex justify-center gap-3">
        <button type="button" @click="closeDialog()" 
                class="rounded-lg border border-zinc-200 px-6 py-2.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800">
            Cancel
        </button>
        <button type="submit" 
                class="inline-flex items-center gap-2 rounded-lg bg-red-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
            Delete
        </button>
    </div>
</form>
