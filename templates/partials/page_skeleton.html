<div id="page-skeleton" aria-busy="true" aria-label="Loading">
    <div data-variant="list">
        <div class="skel h-4 w-40"></div>
        <div class="mt-4 flex items-center justify-between gap-4">
            <div class="skel h-9 w-72 max-w-full"></div>
            <div class="skel h-10 w-32"></div>
        </div>
        <div class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4">
            {% for _ in "1234" %}<div class="skel h-24 rounded-2xl"></div>{% endfor %}
        </div>
        <div class="mt-6 rounded-2xl border border-zinc-200/90 bg-white p-5 dark:border-zinc-800 dark:bg-zinc-900">
            <div class="skel h-10 w-full max-w-md"></div>
            <div class="mt-6 space-y-4">
                {% for _ in "123456" %}
                <div class="flex items-center gap-4">
                    <div class="skel skel-round h-10 w-10 shrink-0"></div>
                    <div class="min-w-0 flex-1 space-y-2">
                        <div class="skel h-4 w-1/3"></div>
                        <div class="skel h-3 w-1/2"></div>
                    </div>
                    <div class="skel hidden h-7 w-20 sm:block"></div>
                    <div class="skel hidden h-7 w-16 md:block"></div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div data-variant="profile">
        <div class="skel h-4 w-48"></div>
        <div class="mt-5 flex items-center gap-4">
            <div class="skel h-16 w-16 shrink-0 rounded-2xl"></div>
            <div class="min-w-0 flex-1 space-y-3">
                <div class="skel h-7 w-64 max-w-full"></div>
                <div class="skel h-4 w-80 max-w-full"></div>
            </div>
        </div>
        <div class="mt-8 grid grid-cols-1 gap-6 lg:grid-cols-3">
            <div class="space-y-6 lg:col-span-2">
                <div class="grid grid-cols-3 gap-4">
                    {% for _ in "123" %}<div class="skel h-24 rounded-xl"></div>{% endfor %}
                </div>
                <div class="skel h-56 rounded-xl"></div>
                <div class="skel h-40 rounded-xl"></div>
            </div>
            <div class="space-y-6">
                <div class="skel h-48 rounded-xl"></div>
                <div class="skel h-40 rounded-xl"></div>
            </div>
        </div>
    </div>

    <div data-variant="form">
        <div class="skel h-4 w-40"></div>
        <div class="mt-4 skel h-8 w-64 max-w-full"></div>
        <div class="mt-8 max-w-3xl space-y-6 rounded-2xl border border-zinc-200/90 bg-white p-6 dark:border-zinc-800 dark:bg-zinc-900">
            {% for _ in "12345" %}
            <div class="space-y-2">
                <div class="skel h-4 w-32"></div>
                <div class="skel h-11 w-full"></div>
            </div>
            {% endfor %}
            <div class="skel h-11 w-36"></div>
        </div>
    </div>

    <div data-variant="dashboard">
        <div class="skel h-8 w-56"></div>
        <div class="mt-6 flex flex-wrap gap-3">
            {% for _ in "123" %}<div class="skel h-10 w-40"></div>{% endfor %}
        </div>
        <div class="mt-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
            {% for _ in "1234" %}<div class="skel h-28 rounded-2xl"></div>{% endfor %}
        </div>
        <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div class="skel h-72 rounded-2xl"></div>
            <div class="skel h-72 rounded-2xl"></div>
        </div>
    </div>
</div>
