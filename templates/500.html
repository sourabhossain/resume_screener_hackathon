<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong - Career</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/%3E%3C/svg%3E">
    <script>

        try { if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #fafafa; --fg: #18181b; --muted: #71717a; --card: #ffffff;
            --border: #e4e4e7; --border-hover: #d4d4d8; --accent: #4f46e5; --accent-hover: #4338ca;
            --ghost: #18181b0d;
        }
        html.dark {
            --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b;
            --border: #27272a; --border-hover: #3f3f46; --accent: #6366f1; --accent-hover: #818cf8;
            --ghost: #ffffff14;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            background: var(--bg); color: var(--fg);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 12px; color: var(--fg); }
        .logo {
            width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #4f46e5, #7c3aed); color: #fff;
        }
        .brand b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
        .toggle {
            display: flex; border: 1px solid var(--border); background: var(--card); color: var(--muted);
            border-radius: 10px; padding: 9px; cursor: pointer;
        }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px 16px; }
        .center { text-align: center; max-width: 520px; }
        .code {
            font-size: clamp(6rem, 22vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
            background: linear-gradient(135deg, #e11d48, #f97316); -webkit-background-clip: text;
            background-clip: text; color: transparent; margin: 0 0 8px;
        }
        h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
        p.lead { color: var(--muted); font-size: 1rem; margin: 0 0 32px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px;
            border-radius: 12px; font-size: .9rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
        }
        .btn svg { width: 18px; height: 18px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: var(--card); color: var(--fg); border-color: var(--border); }
        .btn-ghost:hover { border-color: var(--border-hover); background: var(--ghost); }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{% url 'core:careers' %}">
            <span class="logo" aria-hidden="true">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </span>
            <b>Career</b>
        </a>
        <button class="toggle" type="button" aria-label="Toggle dark mode"
                onclick="var d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('darkMode',d)}catch(e){}">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </nav>

    <main>
        <div class="center">
            <p class="code">500</p>
            <h1>Something went wrong</h1>
            <p class="lead">Our team has been notified. Please try again in a moment.</p>
            <div class="actions">
                <a class="btn btn-primary" href="#" onclick="history.back(); return false;">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Go back &amp; try again
                </a>
                <a class="btn btn-ghost" href="{% url 'core:careers' %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Browse open positions
                </a>
            </div>
        </div>
    </main>
</body>
</html>
