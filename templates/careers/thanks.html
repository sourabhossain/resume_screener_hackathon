{% extends 'base.html' %}

{% block title %}Application received · Career{% endblock %}

{% block nav_action %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl text-center">
    <div class="rounded-2xl border border-zinc-200/90 bg-white p-8 shadow-soft dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-soft-dark sm:p-12">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 dark:bg-emerald-950/40">
            <svg class="h-8 w-8 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="mt-6 text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">Application received</h1>
        <p class="mt-2 text-zinc-500 dark:text-zinc-400">
            Thanks for applying to <span class="font-semibold text-zinc-700 dark:text-zinc-200">{{ job.title }}</span>.
            Our team will review your resume and get back to you.
        </p>

        <a href="{% url 'core:careers' %}" class="btn-primary mt-8 inline-flex items-center gap-2 rounded-lg px-5 py-3 text-sm font-semibold text-white">
            Browse more positions
        </a>
    </div>
</div>
{% endblock %}
