<div x-show="viewerOpen"
     x-cloak
     @keydown.window.escape="closeViewer()"
     @keydown.window.arrow-left.prevent="prevDoc()"
     @keydown.window.arrow-right.prevent="nextDoc()"
     class="fixed inset-0 z-50 flex flex-col bg-zinc-950/95 backdrop-blur-sm print:hidden"
     role="dialog"
     aria-modal="true"
     aria-label="Document viewer">

    <div class="flex shrink-0 items-center gap-3 border-b border-white/10 px-4 py-3 sm:px-6">
        <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-white" x-text="current.label"></p>
            <p class="mt-0.5 truncate text-xs text-zinc-400">
                <span x-text="current.name"></span>
                <span x-show="current.size"> &middot; <span x-text="current.size"></span></span>
                <span x-show="docs.length > 1"> &middot; <span x-text="(index + 1) + ' of ' + docs.length"></span></span>
            </p>
        </div>

        <a :href="current.download"
           class="hidden shrink-0 items-center gap-1.5 rounded-lg border border-white/15 px-3 py-1.5 text-xs font-semibold text-zinc-200 transition hover:bg-white/10 sm:inline-flex">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
            Download
        </a>
        <a :href="current.view" target="_blank" rel="noopener"
           class="hidden shrink-0 items-center gap-1.5 rounded-lg border border-white/15 px-3 py-1.5 text-xs font-semibold text-zinc-200 transition hover:bg-white/10 sm:inline-flex">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            New tab
        </a>
        <button type="button" @click="closeViewer()" aria-label="Close viewer"
                class="shrink-0 rounded-lg border border-white/15 p-1.5 text-zinc-300 transition hover:bg-white/10">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div class="relative flex min-h-0 flex-1 items-center justify-center p-3 sm:p-6">
        <button type="button" x-show="docs.length > 1" @click="prevDoc()" aria-label="Previous document"
                class="absolute left-2 z-10 rounded-full bg-white/10 p-2.5 text-white transition hover:bg-white/20 sm:left-4">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <template x-if="current.kind === 'image'">
            <img :src="current.view" :alt="current.label"
                 class="max-h-full max-w-full rounded-lg bg-white object-contain shadow-2xl">
        </template>

        <template x-if="current.kind === 'pdf'">
            <iframe :src="current.view" :title="current.label"
                    class="h-full w-full max-w-5xl rounded-lg border-0 bg-white shadow-2xl"></iframe>
        </template>

        <template x-if="current.kind === 'file'">
            <div class="max-w-sm rounded-2xl bg-zinc-900 p-8 text-center ring-1 ring-white/10">
                <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-zinc-800">
                    <svg class="h-7 w-7 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                </div>
                <p class="mt-4 text-sm font-semibold text-white" x-text="current.name"></p>
                <p class="mt-1.5 text-xs leading-relaxed text-zinc-400">
                    Word documents cannot be previewed in the browser. Download it to open.
                </p>
                <a :href="current.download"
                   class="mt-5 inline-flex items-center gap-1.5 rounded-lg bg-white px-4 py-2 text-sm font-semibold text-zinc-900 transition hover:bg-zinc-200">
                    Download
                </a>
            </div>
        </template>

        <button type="button" x-show="docs.length > 1" @click="nextDoc()" aria-label="Next document"
                class="absolute right-2 z-10 rounded-full bg-white/10 p-2.5 text-white transition hover:bg-white/20 sm:right-4">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>

    <div x-show="docs.length > 1" class="shrink-0 overflow-x-auto border-t border-white/10 px-4 py-3">
        <div class="flex gap-2">
            <template x-for="(doc, i) in docs" :key="i">
                <button type="button" @click="index = i"
                        :aria-label="'View ' + doc.label"
                        :class="i === index ? 'ring-2 ring-white' : 'ring-1 ring-white/15 opacity-60 hover:opacity-100'"
                        class="relative h-14 w-14 shrink-0 overflow-hidden rounded-lg bg-zinc-800 transition">
                    <template x-if="doc.kind === 'image'">
                        <img :src="doc.view" alt="" class="h-full w-full object-cover">
                    </template>
                    <template x-if="doc.kind !== 'image'">
                        <span class="flex h-full w-full items-center justify-center text-[10px] font-bold uppercase text-zinc-400"
                              x-text="doc.ext"></span>
                    </template>
                </button>
            </template>
        </div>
    </div>
</div>
