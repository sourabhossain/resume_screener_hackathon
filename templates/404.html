{% load static %}<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Career</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>

        try { if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #fafafa; --fg: #18181b; --muted: #71717a; --card: #ffffff;
            --border: #e4e4e7; --border-hover: #d4d4d8; --accent: #4f46e5; --accent-hover: #4338ca;
            --ghost: #18181b0d;
        }
        html.dark {
            --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b;
            --border: #27272a; --border-hover: #3f3f46; --accent: #6366f1; --accent-hover: #818cf8;
            --ghost: #ffffff14;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            background: var(--bg); color: var(--fg);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 12px; color: var(--fg); }
        .logo {
            width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #4f46e5, #7c3aed); color: #fff;
        }
        .brand b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
        .toggle {
            display: flex; border: 1px solid var(--border); background: var(--card); color: var(--muted);
            border-radius: 10px; padding: 9px; cursor: pointer;
        }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px 16px; }
        .center { text-align: center; max-width: 520px; }
        .code {
            font-size: clamp(6rem, 22vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
            background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text;
            background-clip: text; color: transparent; margin: 0 0 8px;
        }
        h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
        p.lead { color: var(--muted); font-size: 1rem; margin: 0 0 32px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px;
            border-radius: 12px; font-size: .9rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
        }
        .btn svg { width: 18px; height: 18px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: var(--card); color: var(--fg); border-color: var(--border); }
        .btn-ghost:hover { border-color: var(--border-hover); background: var(--ghost); }
    </style>
</head>
<body class="flex min-h-screen flex-col bg-zinc-50 text-zinc-900 antialiased transition-colors duration-200 dark:bg-zinc-950 dark:text-zinc-100">

    <!-- Background decoration (matches base.html) -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-40 left-1/2 h-[min(42rem,90vh)] w-[min(140%,52rem)] -translate-x-1/2 rounded-[100%] bg-gradient-to-b from-primary-500/[0.12] to-transparent blur-3xl dark:from-primary-500/[0.16]"></div>
        <div class="absolute right-[-10%] top-[12%] h-72 w-72 rounded-full bg-violet-600/[0.06] blur-3xl dark:bg-violet-500/[0.12]"></div>
    </div>

    <!-- Minimal nav -->
    <nav class="glass sticky top-0 z-50 border-b border-zinc-200/80 dark:border-zinc-800/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
            <a href="{% url 'core:careers' %}" class="group inline-flex items-center gap-3">
                <img src="{% static 'img/ssl-wireless-logo-nav.png' %}" alt="SSL Wireless" class="h-11 w-auto sm:h-12" width="160" height="52">
                <span class="hidden border-l border-zinc-200 pl-3 text-sm font-bold tracking-tight text-zinc-900 dark:border-zinc-700 dark:text-zinc-100 sm:block">Careers</span>
            </a>
            <!-- Dark mode toggle -->
            <button @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)"
                    aria-label="Toggle dark mode"
                    class="rounded-xl border border-zinc-200 bg-white p-2.5 shadow-sm transition-colors hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:hover:bg-zinc-800">
                <svg x-show="!darkMode" class="h-5 w-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg x-show="darkMode" class="h-5 w-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main>
        <div class="center">
            <p class="code">404</p>
            <h1>Page not found</h1>
            <p class="lead">The page you're looking for doesn't exist or has been moved.</p>
            <div class="actions">
                <a class="btn btn-primary" href="{% if user.is_authenticated %}{% url 'core:dashboard' %}{% else %}{% url 'core:careers' %}{% endif %}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    {% if user.is_authenticated %}Go to Dashboard{% else %}Browse open positions{% endif %}
                </a>
                <a class="btn btn-ghost" href="#" onclick="history.back(); return false;">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Go back
                </a>
            </div>
        </div>
    </main>
</body>
</html>
