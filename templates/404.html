{% load static %}<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found · SSL Wireless Careers</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .gradient-bg { background: linear-gradient(145deg, #4f46e5 0%, #6366f1 55%, #7c3aed 100%); }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
        }
        .dark .glass { background: rgba(9,9,11,0.78); }
        .btn-primary {
            background-color: #4f46e5;
            box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px -4px rgba(79,70,229,.45);
            transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 8px 24px -6px rgba(79,70,229,.5);
        }
        .animate-fade-in {
            animation: fadeIn 0.55s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex min-h-screen flex-col bg-zinc-50 text-zinc-900 antialiased transition-colors duration-200 dark:bg-zinc-950 dark:text-zinc-100">

    <!-- Background decoration (matches base.html) -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-40 left-1/2 h-[min(42rem,90vh)] w-[min(140%,52rem)] -translate-x-1/2 rounded-[100%] bg-gradient-to-b from-primary-500/[0.12] to-transparent blur-3xl dark:from-primary-500/[0.16]"></div>
        <div class="absolute right-[-10%] top-[12%] h-72 w-72 rounded-full bg-violet-600/[0.06] blur-3xl dark:bg-violet-500/[0.12]"></div>
    </div>

    <!-- Minimal nav -->
    <nav class="glass sticky top-0 z-50 border-b border-zinc-200/80 dark:border-zinc-800/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
            <a href="{% url 'core:careers' %}" class="group inline-flex items-center gap-3">
                <img src="{% static 'img/ssl-wireless-logo-nav.png' %}" alt="SSL Wireless" class="h-11 w-auto sm:h-12" width="160" height="52">
                <span class="hidden border-l border-zinc-200 pl-3 text-sm font-bold tracking-tight text-zinc-900 dark:border-zinc-700 dark:text-zinc-100 sm:block">Careers</span>
            </a>
            <!-- Dark mode toggle -->
            <button @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)"
                    aria-label="Toggle dark mode"
                    class="rounded-xl border border-zinc-200 bg-white p-2.5 shadow-sm transition-colors hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:hover:bg-zinc-800">
                <svg x-show="!darkMode" class="h-5 w-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg x-show="darkMode" class="h-5 w-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Error content -->
    <main class="flex flex-1 items-center justify-center px-4 py-16">
        <div class="animate-fade-in text-center">

            <!-- Number + icon overlay -->
            <div class="relative mb-8 inline-block select-none">
                <span class="text-[clamp(7rem,25vw,11rem)] font-black leading-none text-zinc-100 dark:text-zinc-800">404</span>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="flex h-24 w-24 items-center justify-center rounded-full bg-primary-100 dark:bg-primary-950/40 sm:h-28 sm:w-28">
                        <svg class="h-12 w-12 text-zinc-400 sm:h-14 sm:w-14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <h1 class="mb-3 text-2xl font-semibold tracking-tight text-zinc-900 dark:text-white sm:text-3xl">
                Page not found
            </h1>
            <p class="mx-auto mb-10 max-w-md text-base text-zinc-500 dark:text-zinc-400">
                The page you're looking for doesn't exist or has been moved.
            </p>

            <div class="flex flex-col items-center justify-center gap-3 sm:flex-row sm:gap-4">
                <a href="{% url 'core:dashboard' %}"
                   class="btn-primary inline-flex w-full items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold text-white sm:w-auto">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    Go to Dashboard
                </a>
                <a href="#" onclick="history.back(); return false;"
                   class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-zinc-200 px-6 py-3 text-sm font-medium text-zinc-700 transition-colors hover:bg-zinc-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800 sm:w-auto">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Go back
                </a>
            </div>

        </div>
    </main>

</body>
</html>
