{{ logic_rules|json_script:"form-logic-rules" }}
{{ logic_context|json_script:"form-logic-context" }}
<script>
(function () {
    const rulesEl = document.getElementById('form-logic-rules');
    const contextEl = document.getElementById('form-logic-context');
    if (!rulesEl) return;
    let rules = {}, context = {};
    try { rules = JSON.parse(rulesEl.textContent) || {}; } catch (_) { return; }
    try { context = JSON.parse(contextEl.textContent) || {}; } catch (_) {}
    const keys = Object.keys(rules);
    if (!keys.length) return;

    function controls(key) {
        return Array.from(document.querySelectorAll('[name="' + key + '"]'));
    }

    function valueOf(key) {
        const els = controls(key);
        if (!els.length) return context[key];
        const first = els[0];
        if (first.type === 'radio') {
            const on = els.find(function (el) { return el.checked; });
            return on ? on.value : '';
        }
        if (first.type === 'checkbox') {
            if (first.hasAttribute('data-boolean')) return first.checked ? 'yes' : 'no';
            return els.filter(function (el) { return el.checked; }).map(function (el) { return el.value; });
        }
        if (first.type === 'file') {
            const block = first.closest('[data-question]');
            if (block && block.hasAttribute('data-uploaded')) return true;
            return first.files && first.files.length ? true : '';
        }
        return first.value;
    }

    function blank(v) {
        if (v === null || v === undefined) return true;
        if (Array.isArray(v)) return v.length === 0;
        if (typeof v === 'string') return v.trim() === '';
        return false;
    }

    function hiddenKey(key) {
        const block = document.querySelector('[data-question="' + key + '"]');
        return !!(block && block.hidden);
    }

    function evaluate(rule) {
        if (!rule) return true;
        if (rule.all) return rule.all.every(evaluate);
        if (rule.any) return rule.any.some(evaluate);
        if (rule.not) return !evaluate(rule.not);
        const v = hiddenKey(rule.q) ? '' : valueOf(rule.q);
        if (rule.filled) return !blank(v);
        const options = rule.in || [];
        if (Array.isArray(v)) return v.some(function (x) { return options.indexOf(x) !== -1; });
        return options.indexOf(v) !== -1;
    }

    function setStar(block, on) {
        const label = block.querySelector('label');
        if (!label) return;
        let star = label.querySelector('[data-conditional-star]');
        if (on && !star) {
            star = document.createElement('span');
            star.setAttribute('data-conditional-star', '');
            star.className = 'ml-0.5 text-rose-500';
            star.textContent = '*';
            label.appendChild(star);
        } else if (!on && star) {
            star.remove();
        }
    }

    function apply() {
        keys.forEach(function (key) {
            const block = document.querySelector('[data-question="' + key + '"]');
            if (!block) return;
            const rule = rules[key];
            const visible = evaluate(rule.show_if);
            block.hidden = !visible;
            if (rule.required_if && !rule.required) setStar(block, visible && evaluate(rule.required_if));
        });
        document.querySelectorAll('[data-logic-group]').forEach(function (group) {
            const blocks = Array.from(group.querySelectorAll('[data-question]'));
            group.hidden = blocks.length > 0 && blocks.every(function (b) { return b.hidden; });
        });
    }

    document.addEventListener('change', apply);
    document.addEventListener('input', apply);
    document.addEventListener('htmx:afterSwap', apply);
    apply();
})();
</script>
